<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprouts Online</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--desk:#e2e9ee;--paper:#fbfdfe;--grid:#dde8ee;--ink:#1c2b36;--mut:#5d6f7b;--p1:#d6336c;--p2:#1c7ed6;--card:#fff;--line:#c9d6de;--sh:0 1px 2px rgba(28,43,54,.06),0 8px 24px rgba(28,43,54,.08);--f:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media all{:root[data-theme=dark]{color-scheme:dark;--desk:#0d161d;--paper:#14232e;--grid:#1d3240;--ink:#e8f0f5;--mut:#8ea2af;--p1:#ff6b9a;--p2:#5fb0ff;--card:#182934;--line:#27414f;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;padding:clamp(12px,3vw,32px);background:var(--desk);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
h1{font:700 1.75rem/1 var(--f);margin:0;letter-spacing:-.03em}
header p{margin:0;color:var(--mut);font-size:.9rem}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;transition:border-color .25s,box-shadow .25s}
.pl i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.pl input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-weight:700}
.pl em{font-style:normal;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--c);color:var(--paper);white-space:nowrap}
.pl.on,.pl:focus-within{border-color:var(--c)}
.pl.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 16%,transparent)}
.pl input:disabled{opacity:.75}
#st{min-height:1.5em}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:8px}
canvas{display:block;width:100%;aspect-ratio:3/2;touch-action:none;border-radius:10px;background:var(--paper);cursor:grab}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.9rem}
.sp{flex:1}
select,input[type=number],button{font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;transition:border-color .15s,background .15s,opacity .15s}
input[type=number]{width:5.2em;padding:6px 8px;cursor:text;text-align:center;-moz-appearance:textfield}
button:hover:not(:disabled),select:hover{border-color:var(--ink)}
button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;color:var(--mut)}
summary{cursor:pointer;color:var(--ink);font-weight:500}
@media(max-width:560px){.players{grid-template-columns:1fr}}
.clk{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mut);min-width:3.2ch;text-align:right}
.pl.on .clk{color:var(--ink)}.clk.low{color:#e03131!important;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.4}}
body[data-ph=lobby] .sheet,body[data-ph=lobby] .bar,body[data-ph=count] .sheet,body[data-ph=count] .bar,body[data-ph=play] #lobby,body[data-ph=play] #net,body[data-ph=play] #leaderboardBox{display:none}
.lob{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.match-container{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);padding:12px;border-radius:10px;border:1px solid var(--line)}
.match-container input[type=text]{padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.btn-quick{background:#16a34a;color:#fff;font-weight:700;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;transition:background 0.2s}
.btn-quick:hover{background:#15803d}
.btn-cancel{background:#dc2626!important}
.btn-cancel:hover{background:#b91c1c!important}
.lb-table{width:100%;border-collapse:collapse;margin-top:8px}
.lb-table th,.lb-table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
.lb-table th{color:var(--mut);font-size:0.85rem;text-transform:uppercase}
</style></head><body data-ph="lobby"><main>
<header><h1>Sprouts Online</h1><p>Draw curves, grow new spots, and leave your opponent without a move.</p><span class="sp"></span><button id="mu"></button><button id="th"></button></header>
<section class="players">
<div class="pl" id="c0" style="--c:var(--p1)"><i></i><input id="p0" maxlength="16" value="Player 1"><em id="t0" hidden></em><span class="clk" id="k0"></span></div>
<div class="pl" id="c1" style="--c:var(--p2)"><i></i><input id="p1" maxlength="16" value="Player 2"><em id="t1" hidden></em><span class="clk" id="k1"></span></div>
</section>
<div id="st" role="status"></div>

<section class="lob" id="lobby">
  <h2>Lobby</h2>
  <div class="match-container">
    <label for="pNameInput"><b>Tên của bạn:</b></label>
    <input type="text" id="pNameInput" maxlength="16" value="Player">
    <button id="btnQuickMatch" class="btn-quick">⚡ Tìm trận nhanh (Ghép tự động)</button>
  </div>
  <p id="matchStatus" style="margin:0;font-weight:600;color:var(--p2)"></p>
  <div class="lrow" style="display:flex;gap:18px">
    <label>Spots <select id="n"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
    <label>Minutes <input id="tm" type="number" min="0" max="999" value="5"></label>
  </div>
</section>

<section class="lob" id="leaderboardBox">
  <h2>🏆 Bảng Xếp Hạng Elo (Top 10)</h2>
  <table class="lb-table">
    <thead><tr><th>#</th><th>Tên người chơi</th><th>Điểm Elo</th></tr></thead>
    <tbody id="lbBody"><tr><td colspan="3">Chưa có dữ liệu</td></tr></tbody>
  </table>
</section>

<div class="sheet" id="sheet"><canvas id="c"></canvas></div>
<div class="bar">
  <span class="sp"></span><button id="zo">−</button><button id="zi">+</button><button id="ft">Fit</button><button id="nw" class="pri">Back to lobby</button>
</div>
</main>

<script>
const socket = typeof io !== 'undefined' ? io() : null;
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const W=900,H=600,R=11,D=2;cv.width=W*D;cv.height=H*D;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),pc=p=>css(p?'--p2':'--p1');
let spots=[],lines=[],turn=0,over=false,cur=null,seat=-1,isSearching=false;
const names=['Player 1','Player 2'];

// ---- Socket.io Matchmaking & Leaderboard ----
if (socket) {
  $('pNameInput').onchange = () => {
    socket.emit('set_name', { name: $('pNameInput').value });
  };

  $('btnQuickMatch').onclick = () => {
    const pName = $('pNameInput').value || 'Player';
    if (!isSearching) {
      isSearching = true;
      $('btnQuickMatch').textContent = '❌ Hủy tìm trận';
      $('btnQuickMatch').classList.add('btn-cancel');
      $('pNameInput').disabled = true;
      $('matchStatus').textContent = '🔍 Đang tìm đối thủ trên máy chủ...';
      socket.emit('find_match', { name: pName });
    } else {
      resetMatchBtn();
      socket.emit('cancel_match');
    }
  };

  socket.on('waiting_for_match', () => {
    $('matchStatus').textContent = '⏳ Đang chờ người chơi khác ghép trận...';
  });

  socket.on('match_found', (data) => {
    seat = data.role;
    names[seat] = $('pNameInput').value || 'You';
    names[seat ^ 1] = data.opponent;
    $('p0').value = names[0];
    $('p1').value = names[1];
    $('matchStatus').textContent = `🎉 Đã kết nối với ${data.opponent}!`;
    document.body.dataset.ph = 'play';
    resetGame();
  });

  socket.on('leaderboard_update', (data) => {
    const tbody = $('lbBody');
    if (!data || !data.length) {
      tbody.innerHTML = '<tr><td colspan="3">Chưa có dữ liệu</td></tr>';
      return;
    }
    tbody.innerHTML = data.map((u, i) => `<tr><td><b>${i + 1}</b></td><td>${u.name}</td><td><b>${u.elo}</b></td></tr>`).join('');
  });

  socket.on('game_action', (data) => {
    if (data.t === 'move') {
      spots = data.spots;
      lines = data.lines;
      turn = data.turn;
      over = data.over;
      draw();
      if (over) {
        alert('Ván đấu đã kết thúc!');
      }
    }
  });

  socket.on('opponent_left', () => {
    alert('Đối thủ đã rời ván đấu!');
    resetMatchBtn();
    document.body.dataset.ph = 'lobby';
  });
}

function resetMatchBtn() {
  isSearching = false;
  $('btnQuickMatch').textContent = '⚡ Tìm trận nhanh (Ghép tự động)';
  $('btnQuickMatch').classList.remove('btn-cancel');
  $('btnQuickMatch').disabled = false;
  $('pNameInput').disabled = false;
  $('matchStatus').textContent = '';
}

function resetGame() {
  spots = []; lines = []; turn = 0; over = false;
  const n = +$('n').value;
  for (let t = 0; spots.length < n && t < 2000; t++) {
    const p = { x: (Math.random() - .5) * (W - 140), y: (Math.random() - .5) * (H - 140), d: 0 };
    if (spots.every(s => Math.hypot(s.x - p.x, s.y - p.y) > 100)) spots.push(p);
  }
  draw();
}

function draw() {
  g.setTransform(D, 0, 0, D, 0, 0); g.clearRect(0, 0, W, H);
  g.setTransform(D, 0, 0, D, D * W / 2, D * H / 2);
  g.lineWidth = 3;
  lines.forEach(l => {
    g.strokeStyle = pc(l.c);
    g.beginPath();
    l.p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]));
    g.stroke();
  });
  spots.forEach((s) => {
    g.beginPath(); g.arc(s.x, s.y, R, 0, 7);
    g.fillStyle = s.d < 3 ? css('--paper') : css('--ink');
    g.fill(); g.stroke();
  });
}

$('nw').onclick = () => {
  resetMatchBtn();
  document.body.dataset.ph = 'lobby';
};

document.body.dataset.ph = 'lobby';
draw();
</script></body></html>
