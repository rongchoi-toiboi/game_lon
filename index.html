<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprouts Matchmaking</title>
<style>
:root{--desk:#e2e9ee;--paper:#fbfdfe;--grid:#dde8ee;--ink:#1c2b36;--mut:#5d6f7b;--p1:#d6336c;--p2:#1c7ed6;--card:#fff;--line:#c9d6de;--sh:0 1px 2px rgba(28,43,54,.06),0 8px 24px rgba(28,43,54,.08);--f:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;padding:20px;background:var(--desk);color:var(--ink);font:15px/1.5 var(--f)}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;gap:16px}
h1{font:700 1.75rem var(--f);margin:0}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:8px}
canvas{display:block;width:100%;aspect-ratio:3/2;border-radius:10px;background:var(--paper)}
.bar{display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
button.pri{background:var(--ink);color:var(--paper)}
#match-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<main>
<header><h1>Sprouts - Tự động tìm trận</h1></header>

<div id="match-box">
    <button id="findBtn" class="pri">⚡ Tự động tìm đối thủ ngẫu nhiên</button>
    <p id="statusText">Bấm nút trên để bắt đầu tìm người chơi cùng bạn.</p>
</div>

<div class="sheet"><canvas id="c"></canvas></div>

<div class="bar">
    <button id="nw" class="pri">Tìm trận mới</button>
</div>
</main>

<!-- Socket.io client -->
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const findBtn = document.getElementById('findBtn');
const statusText = document.getElementById('statusText');

findBtn.onclick = () => {
    findBtn.disabled = true;
    statusText.innerText = "Đang kết nối vào hàng đợi tìm trận...";
    socket.emit('find_match');
};

socket.on('waiting', (data) => {
    statusText.innerText = data.message;
});

socket.on('match_found', (data) => {
    statusText.innerText = "Đã tìm thấy đối thủ! Chuẩn bị vào trận...";
    findBtn.style.display = 'none';
});
</script>
</body>
</html>
